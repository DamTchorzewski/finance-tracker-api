# CI: the quality gate of the API. Formatting, lint, types, unit tests, the OpenAPI contract and a dependency audit.
#
# Triggers: every pull request (not drafts, not documentation-only), manual run, and `workflow_call` from Build & Deploy
# (push to develop and main). No `push` trigger: a branch with a pull request would be checked twice.
# Before a PR, run `pnpm check` locally.
# Secrets: none (the tests use a fake token verifier and an in-memory store; fork PRs can run it).
# Standard: reops/standards/workflows.md (global, outside this repo)

name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
      - "**/.env.example"
      - ".github/dependabot.yml"
      - ".scratch/**"
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.workflow == 'CI' }}

permissions:
  contents: read

jobs:
  quality:
    name: Format, lint, types, tests, contract, audit
    if: ${{ github.event.pull_request.draft != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      # The web app generates its client from openapi.json; a route change must come with the regenerated file.
      - name: OpenAPI contract is up to date
        run: pnpm openapi --check

      - name: Audit
        run: pnpm audit --prod --audit-level=high
