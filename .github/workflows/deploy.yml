# Build & Deploy: CI on every push to develop and main; main also deploys the API to Google Cloud Run.
#
# Triggers:
#   - push to main     → CI, deploy to Cloud Run from the source, health check,
#   - push to develop  → CI only (develop never deploys),
#   - manual run       → the same as the branch it is run from.
# Documentation-only pushes start nothing.
#
# Cloud Run builds the container from the source with Google's Node.js buildpack (no Dockerfile; it runs `pnpm start`,
# Node strips the TypeScript types itself). The service is `finance-tracker-api` in europe-west1, min 0 / max 2
# instances, small memory: the free tier. Firebase Hosting of the web app rewrites /api/** to it.
#
# Sign-in to Google: Workload Identity Federation, so there is no key in GitHub (setup: docs/deployment.md).
# Environment "production" (Settings → Environments; deployment branches: main only), variables only, no secret:
#   GCP_PROJECT_ID                  the Google Cloud / Firebase project id
#   GCP_REGION                      the Cloud Run region, europe-west1
#   GCP_WORKLOAD_IDENTITY_PROVIDER  projects/<number>/locations/global/workloadIdentityPools/github/providers/github-provider
#   GCP_SERVICE_ACCOUNT             github-deployer@<project>.iam.gserviceaccount.com
#   API_RUNTIME_SERVICE_ACCOUNT     the account the API runs as, with Firestore access (pfm-api@<project>.iam.gserviceaccount.com)
# Standard: reops/standards/workflows.md (global, outside this repo)

name: Build & Deploy

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
      - "**/.env.example"
      - ".github/dependabot.yml"
      - ".scratch/**"
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy to Cloud Run
    needs: ci
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - id: deploy
        uses: google-github-actions/deploy-cloudrun@2028e2d7d30a78c6910e0632e48dd561b064884d # v3
        with:
          service: finance-tracker-api
          region: ${{ vars.GCP_REGION }}
          source: .
          env_vars: |
            FIREBASE_PROJECT_ID=${{ vars.GCP_PROJECT_ID }}
          flags: >-
            --allow-unauthenticated
            --service-account=${{ vars.API_RUNTIME_SERVICE_ACCOUNT }}
            --min-instances=0
            --max-instances=2
            --memory=256Mi
            --cpu=1

      - name: Health check
        env:
          API_URL: ${{ steps.deploy.outputs.url }}
        run: node scripts/health-check.ts
